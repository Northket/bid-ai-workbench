[alembic]
# NOTE: keep this file ASCII-only (Windows configparser reads it with locale encoding).
# The real DB url is resolved dynamically in alembic/env.py from database.py
# (honors BID_DB_PATH / BID_TEST_MODE).
script_location = alembic
sqlalchemy.url = sqlite:///./data/platform.db
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
